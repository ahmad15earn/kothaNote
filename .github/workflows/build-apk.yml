name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache speech engine and model
        uses: actions/cache@v4
        with:
          path: |
            app/libs/sherpa-onnx-2.0.2.aar
            app/src/main/assets/asr
          key: kotha-speech-v1-${{ runner.os }}-sherpa-2.0.2-whisper-tiny

      - name: Fetch and verify on-device speech assets
        run: bash scripts/fetch-speech.sh

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          for asset in \
            assets/asr/tiny-encoder.int8.onnx \
            assets/asr/tiny-decoder.int8.onnx \
            assets/asr/tiny-tokens.txt; do
            unzip -l "$APK" "$asset" > /dev/null
          done
          unzip -l "$APK" "lib/arm64-v8a/libsherpa-onnx-jni.so" > /dev/null
          unzip -l "$APK" "lib/armeabi-v7a/libsherpa-onnx-jni.so" > /dev/null
          if unzip -l "$APK" | grep -q "lib/x86/"; then
            echo "Unexpected x86 libraries in the phone APK" >&2
            exit 1
          fi
          echo "APK contains the speech model and phone native libraries."

      - name: Prepare release files
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk KothaNote-debug.apk
          sha256sum KothaNote-debug.apk > KothaNote-debug.apk.sha256
          SIZE_MB=$(du -m KothaNote-debug.apk | cut -f1)
          SHA256=$(cut -d' ' -f1 KothaNote-debug.apk.sha256)
          cat > release-notes.md <<EOF
          KothaNote — private voice notes, typed or spoken

          Built from \`$GITHUB_SHA\` on $(date -u +'%Y-%m-%d %H:%M UTC').

          - APK size: ${SIZE_MB} MB
          - SHA-256: \`${SHA256}\`
          - Android 7.0+ (arm64-v8a and armeabi-v7a)
          - Recordings are saved first and transcribed later. With a free Google
            Gemini key, transcripts are made over Wi-Fi or mobile data; without
            one, nothing leaves the phone.

          Download **KothaNote-debug.apk** below. The matching checksum is in **KothaNote-debug.apk.sha256**.
          EOF
          {
            echo "### KothaNote APK"
            echo ""
            echo "- Size: ${SIZE_MB} MB"
            echo "- SHA-256: \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: KothaNote-APK
          path: |
            KothaNote-debug.apk
            KothaNote-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload latest \
              KothaNote-debug.apk KothaNote-debug.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit latest \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file release-notes.md
          else
            gh release create latest \
              KothaNote-debug.apk KothaNote-debug.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "KothaNote latest APK" \
              --notes-file release-notes.md \
              --latest
          fi
          echo "### APK published" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/tag/latest" >> "$GITHUB_STEP_SUMMARY"
